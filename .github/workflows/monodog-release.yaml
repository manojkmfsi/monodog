name: Monodog Release Workflow

on:
  push:
    branches:
      - main
    paths:
      - 'packages/*/package.json'
      - 'packages/*/CHANGELOG.md'
      - 'libs/*/package.json'
      - 'CHANGELOG.md'
      - '.changeset/**'

jobs:
  release-workflow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        run: |
          echo ""
          echo "═════════════════════════════════════════════════════════"
          echo "  Monodog Release Workflow Triggered"
          echo "═════════════════════════════════════════════════════════"
          echo ""
          echo "📊 Event Details:"
          echo "  Branch: main"
          echo "  Commit: ${{ github.sha }}"
          echo "  Actor: ${{ github.actor }}"
          echo ""
          echo "✅ Release workflow has been triggered"
          echo "📈 Release process will:"
          echo "  1. Detect and validate publish changes"
          echo "  2. Log events to database"
          echo "  3. Publish packages to npm registry"
          echo "  4. Create GitHub releases and tags"
          echo ""
          echo "🔗 Monitor: /pipeline?tab=logs"
          echo ""
          echo "═════════════════════════════════════════════════════════"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
