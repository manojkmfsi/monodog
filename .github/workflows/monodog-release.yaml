name: Monodog Release Workflow

on:
  # Trigger on manual button click
  workflow_dispatch:
    inputs:
      packages:
        description: 'Comma-separated list of packages (e.g., @monodog/utils,@monodog/core)'
        required: true
        default: ''
  # Trigger automatically on publish commit (changesets creates version updates and changelogs)
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'package.json'
  #     - 'packages/*/package.json'
  #     - 'libs/*/package.json'
  #     - 'CHANGELOG.md'
  #     - 'packages/*/CHANGELOG.md'
  #     - 'libs/*/CHANGELOG.md'

jobs:
  build:
    name: '@mindfiredigital/monodog Build, Lint, and Test'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create release tags and update the changelog
      pull-requests: write # Required for creating release pull requests (if configured)

    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: 'Install dependencies (at ROOT)'
        run: pnpm install --no-frozen-lockfile

      - name: 'Generate prisma client'
        working-directory: packages/monoapp
        run: npm run generate

      - name: 'Create build (Backend)'
        run: pnpm run build

      - name: 'Lint code'
        run: pnpm run lint

      - name: 'Run tests'
        run: pnpm test

      # Use the 'working-directory' flag specifically for Dashboard
      - name: 'Install dependencies (at Dashboard)'
        working-directory: packages/monoapp/monodog-dashboard
        run: npm install

      - name: 'Create build (Dashboard)'
        working-directory: packages/monoapp/monodog-dashboard
        run: npm run build

      - name: 'Lint code'
        working-directory: packages/monoapp/monodog-dashboard
        run: npm run lint

  create-github-release:
    name: Create GitHub release document and publish to npm
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      pull-requests: write
      packages: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: npm install -g pnpm

      - name: 'Install dependencies with pnpm'
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: 'Generate prisma client'
        working-directory: packages/monoapp
        run: npm run generate

      - name: 'Build Backend'
        run: pnpm run build

      # Use the 'working-directory' flag specifically for Dashboard
      - name: 'Install dependencies - Dashboard'
        working-directory: packages/monoapp/monodog-dashboard
        run: npm install

      - name: 'Build Dashboard'
        working-directory: packages/monoapp/monodog-dashboard
        run: npm run build

      - name: 'Set Git user name and email'
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "GitHub Actions"

      - name: Verify GitHub Token is available
        run: |
          if [ -z "${{ secrets.GITHUB_TOKEN }}" ]; then
            echo "⚠️  WARNING: GITHUB_TOKEN secret is not configured"
          else
            echo "✓ GITHUB_TOKEN is available"
          fi
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "⚠️  WARNING: NPM_TOKEN secret is not configured"
          else
            echo "✓ NPM_TOKEN is available"
          fi

      - name: Configure git credentials for push
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com" > ~/.git-credentials

      - name: Show selected packages
        run: |
          echo "Packages to publish: ${{ github.event.inputs.packages }}"
          if [ -z "${{ github.event.inputs.packages }}" ]; then
            echo "No specific packages selected - will publish all packages with changes"
          fi

      - name: Generate Changeset from commit messages
        run: pnpm changeset:autogenerate
        env:
          SELECTED_PACKAGES: ${{ github.event.inputs.packages }}

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1.4.1
        with:
          publish: npx changeset publish
          commit: 'chore: release packages'
        env:
          # GITHUB_TOKEN is used for GitHub releases/tags/comments and pushing commits
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NPM_TOKEN is used for publishing to the npm registry
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Pass selected packages to publish script
          SELECTED_PACKAGES: ${{ github.event.inputs.packages }}

      - name: Check Changesets Output
        run: |
          echo "Changesets action output:"
          echo "Published: ${{ steps.changesets.outputs.published }}"
          echo "Has changesets: ${{ steps.changesets.outputs.hasChangesets }}"
          if [ "${{ steps.changesets.outputs.published }}" == "true" ]; then
            echo "✓ Packages were published successfully"
          else
            echo "No packages were published in this run"
          fi
