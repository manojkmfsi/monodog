name: Monodog Release Workflow

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Comma-separated list of packages to release (e.g., @monodog/utils,@monodog/backend)'
        required: true
        default: '@monodog/ci-status'
      dryRun:
        description: 'Perform a dry run (no actual publishing)'
        required: false
        default: 'false'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: '8'

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Build all packages
        run: pnpm run build

      - name: Generate Prisma client
        working-directory: packages/monoapp
        run: npx prisma generate
        env:
          DATABASE_URL: file:./dev.db

      - name: Execute release with publish-controller
        working-directory: packages/monoapp
        run: |
          # Display workflow input
          echo "📋 Monodog Release Configuration:"
          echo "  Packages: ${{ inputs.packages }}"
          echo "  Dry Run: ${{ inputs.dryRun }}"
          echo "  Node Version: $(node --version)"
          echo "  npm Version: $(npm --version)"
          echo ""

          # Create release execution script
          cat > .release-workflow.js << 'RELEASE_SCRIPT'
          const path = require('path');
          const fs = require('fs');

          // Log execution start
          console.log('🚀 Starting Monodog Release Pipeline');
          console.log('📦 Loading publishController...');

          try {
            // Import the built publishController
            const { publishController } = require('./dist/services/publish-controller');
            
            if (!publishController) {
              throw new Error('publishController not found in dist/services/publish-controller');
            }

            // Parse inputs
            const packages = process.env.PACKAGES.split(',').map(p => p.trim()).filter(p => p);
            const dryRun = process.env.DRY_RUN === 'true';
            const userId = 'github-actions[bot]';

            console.log(`✅ publishController loaded`);
            console.log(`📦 Packages to release: ${packages.join(', ')}`);
            console.log(`🔄 Dry run mode: ${dryRun}`);
            console.log('');

            // Build package paths mapping
            const packagePaths = {};
            const rootPath = process.cwd();

            // Parse package names and map to paths
            for (const pkgName of packages) {
              let pkgPath;
              
              // Handle scoped packages: @monodog/utils -> monodog/utils or utils
              if (pkgName.startsWith('@')) {
                const parts = pkgName.split('/');
                const scope = parts[0].substring(1); // Remove @
                const name = parts[1];
                
                // Try paths
                const possiblePaths = [
                  path.join(rootPath, '..', name),
                  path.join(rootPath, '..', scope, name),
                  path.join(rootPath, '..', `${scope}-${name}`),
                ];
                
                pkgPath = possiblePaths.find(p => fs.existsSync(path.join(p, 'package.json'))) || possiblePaths[0];
              } else {
                pkgPath = path.join(rootPath, '..', pkgName);
              }

              packagePaths[pkgName] = pkgPath;
              console.log(`  ${pkgName} -> ${pkgPath}`);
            }

            console.log('');

            // Create publish request
            const publishRequest = {
              packageNames: packages,
              packagePaths: packagePaths,
              method: 'github-actions',
              dryRun: dryRun,
              autoTag: true,
              createReleases: !dryRun,
              userId: userId,
            };

            console.log('🔄 Executing publishController.publish()...');
            console.log('');

            // Execute publish and handle result
            publishController.publish(publishRequest)
              .then(result => {
                console.log('');
                console.log('✅ Pipeline execution completed!');
                console.log(`Pipeline ID: ${result.pipelineId}`);
                console.log(`Status: ${result.status}`);
                console.log(`Progress: ${result.progress}%`);
                console.log(`Packages: ${result.packagesToPublish.length}`);
                
                if (Object.keys(result.results).length > 0) {
                  console.log('');
                  console.log('📊 Results:');
                  for (const [pkgName, pkgResult] of Object.entries(result.results)) {
                    const status = pkgResult.success ? '✅' : '❌';
                    console.log(`  ${status} ${pkgName}`);
                    if (!pkgResult.success && pkgResult.errors) {
                      pkgResult.errors.forEach(err => console.log(`     └─ ${err}`));
                    }
                  }
                }
                
                console.log('');
                console.log('🔗 View pipeline logs at: /pipeline#logs');
                
                // Exit with success code if all packages succeeded or if dry-run
                const allSucceeded = Object.values(result.results).every(r => r.success);
                const shouldSucceed = dryRun || allSucceeded;
                process.exit(shouldSucceed ? 0 : 1);
              })
              .catch(error => {
                console.error('');
                console.error('❌ Pipeline execution failed!');
                console.error('Error:', error.message);
                if (error.stack) {
                  console.error('Stack:', error.stack);
                }
                process.exit(1);
              });

          } catch (error) {
            console.error('❌ Failed to initialize release pipeline');
            console.error('Error:', error.message);
            if (error.stack) {
              console.error('Stack:', error.stack);
            }
            process.exit(1);
          }
          RELEASE_SCRIPT

          # Execute the release script
          node .release-workflow.js
        env:
          PACKAGES: ${{ inputs.packages }}
          DRY_RUN: ${{ inputs.dryRun }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATABASE_URL: file:./dev.db
          NODE_ENV: production

      - name: Push tags and commits
        if: ${{ inputs.dryRun == 'false' }}
        working-directory: packages/monoapp
        run: |
          echo "📤 Pushing release changes to GitHub..."
          cd /home/manoj/Documents/mjdog

          # Fetch latest to avoid conflicts
          git fetch origin main || true

          # Push commits
          if ! git diff-index --quiet HEAD --; then
            echo "📝 Found commits to push..."
            git push origin main || echo "⚠️  No commits to push"
          else
            echo "✓ No local commits to push"
          fi

          # Push tags
          if git rev-parse --tags > /dev/null 2>&1; then
            echo "🏷️  Pushing tags..."
            git push --tags origin || echo "⚠️  No tags to push"
          fi

          echo "✅ Push completed"
        continue-on-error: true

      - name: Log pipeline completion
        if: always()
        working-directory: packages/monoapp
        run: |
          echo ""
          echo "═════════════════════════════════════════════════════════"
          echo "  Monodog Release Workflow Complete"
          echo "═════════════════════════════════════════════════════════"
          echo ""
          echo "📊 Workflow Summary:"
          echo "  Packages: ${{ inputs.packages }}"
          echo "  Dry Run: ${{ inputs.dryRun }}"
          echo "  Status: ${{ job.status }}"
          echo ""
          echo "📈 Next Steps:"
          echo "  1. View pipeline logs: /pipeline?tab=logs"
          echo "  2. Check published packages on NPM"
          echo "  3. Verify GitHub releases and tags"
          echo ""
          echo "🔄 Automations Triggered:"
          echo "  ✓ Pipeline events logged to database"
          echo "  ✓ Git commits and tags pushed (if not dry-run)"
          echo "  ✓ Artifacts stored in workflow"
          echo ""
          echo "═════════════════════════════════════════════════════════"
